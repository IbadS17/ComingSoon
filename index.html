<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Honest Fashion Wear — Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="description" content="Honest Fashion Wear – Premium everyday fashion. Website coming soon." />
</head>

<body class="relative bg-[#F4F7F7] overflow-hidden text-gray-800">

    <!-- Background Blobs -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-[#A9D2FF]/40 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-[28rem] h-[28rem] bg-[#A9D2FF]/30 rounded-full blur-3xl"></div>

    <!-- Main Container -->
    <div class="relative min-h-screen flex items-center justify-center px-6">

        <div class="max-w-xl w-full text-center">

            <!-- Brand -->
            <h1 class="text-3xl md:text-4xl font-semibold tracking-wide text-gray-900">
                Honest Fashion Wear
            </h1>

            <div class="h-1 w-20 bg-[#A9D2FF] mx-auto mt-4 rounded-full"></div>

            <!-- Tagline -->
            <p class="mt-6 text-gray-600 text-base md:text-lg leading-relaxed">
                Premium everyday fashion designed with comfort,
                quality, and honesty at its core.
            </p>

            <!-- Coming Soon Card -->
            <div class="mt-10 bg-white/80 backdrop-blur rounded-2xl p-8 border border-gray-200">

                <span
                    class="inline-block mb-4 px-4 py-1.5 rounded-full text-sm font-medium bg-[#A9D2FF]/40 text-gray-900">
                    🚀 Website Launching Soon
                </span>

                <p class="text-gray-600 text-sm md:text-base mb-8">
                    We’re preparing something stylish for you.
                    Till then, feel free to connect with us.
                </p>

                <!-- CTA Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center">

                    <!-- WhatsApp -->
                    <a href="https://wa.me/917718968240" target="_blank"
                        class="px-6 py-3 rounded-lg bg-green-500 text-white font-medium hover:bg-green-600 transition">
                        Chat on WhatsApp
                    </a>

                    <!-- Instagram -->
                    <a href="https://instagram.com/riyazulshaikh" target="_blank"
                        class="px-6 py-3 rounded-lg border border-gray-300 text-gray-800 font-medium hover:bg-white transition">
                        Visit Instagram
                    </a>

                </div>
            </div>

            <!-- Footer -->
            <p class="mt-10 text-sm text-gray-500">
                © <span id="year"></span> Honest Fashion Wear
            </p>

        </div>
    </div>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>

</html>
